<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Zero - Unbeatable Tic-Tac-Toe</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-bg-base: #f8fafc; /* slate-50 */
            --color-border-subtle: #e2e8f0; /* slate-200 */
            --color-accent-indigo: #4f46e5; /* indigo-600 */
            --color-accent-emerald: #059669; /* emerald-600 */
        }
        
        .coin-container {
            perspective: 1000px;
        }
        
        .coin-inner {
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .coin-flipping {
            animation: flip 0.2s infinite linear;
        }
        
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .coin-face {
            backface-visibility: hidden;
            background-image: linear-gradient(rgba(79, 70, 229, 0.85), rgba(79, 70, 229, 0.85)), url('coin_bg.gif');
            background-size: cover;
            background-position: center;
        }

        .coin-back {
            transform: rotateY(180deg);
            background-image: linear-gradient(rgba(5, 150, 105, 0.85), rgba(5, 150, 105, 0.85)), url('coin_bg.gif');
        }

        /* Responsive Coin Size */
        .coin-container {
            width: clamp(6rem, 20vw, 8rem);
            height: clamp(6rem, 20vw, 8rem);
        }
    </style>
</head>
<body class="bg-bg-base font-sans font-light text-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-border-subtle transition-all duration-500 overflow-hidden flex flex-col">
        
        <!-- Full-width Header -->
        <div id="header-image-container" class="w-full h-48 overflow-hidden shrink-0">
            <img src="Stalemate.png" alt="AI Hero" class="w-full h-full object-cover">
        </div>

        <!-- Content Area with Padding -->
        <div class="p-8 flex-grow">
            <!-- View 1: The Toss -->
            <div id="view-toss" class="hidden space-y-6">
                <div class="text-center space-y-6">
                    <h1 class="text-3xl font-semibold tracking-tight text-slate-900 leading-tight">Are you future ready?</h1>
                    <p class="text-slate-500 text-base px-2 font-light">Are you safe in the AI-driven world? Let's check if you are future ready to survive the AI.</p>
                    
                    <div class="coin-container mx-auto my-8">
                        <div id="coin-inner" class="coin-inner w-full h-full relative">
                            <div class="coin-face absolute inset-0 rounded-full flex items-center justify-center text-white text-lg font-thin tracking-widest shadow-lg ring-4 ring-accent-indigo/20">YOU</div>
                            <div class="coin-face coin-back absolute inset-0 rounded-full flex items-center justify-center text-white text-lg font-thin tracking-widest shadow-lg ring-4 ring-accent-emerald/20">AI</div>
                        </div>
                    </div>
                    <h2 id="toss-status" class="text-xl font-medium tracking-tight text-slate-800 h-8">Click below to start</h2>
                    
                    <button id="start-toss-btn" class="mt-4 px-8 py-4 bg-accent-indigo text-white font-semibold rounded-2xl shadow-md hover:scale-105 active:scale-95 transition-all cursor-pointer w-full">
                        Start Digital Toss
                    </button>
                </div>
            </div>

            <!-- View 2: Gameplay -->
            <div id="view-gameplay" class="hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h1 id="app-title" class="text-xl font-semibold tracking-tighter text-slate-400 uppercase">FUTURE READY?</h1>
                    <div id="game-status" class="text-sm font-medium px-3 py-1 bg-slate-100 rounded-full text-slate-600">
                        Your Turn
                    </div>
                </div>

                <div id="grid" class="grid grid-cols-3 gap-3">
                    <!-- Grid items injected here -->
                </div>
                
                <div id="local-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center rounded-3xl z-10">
                    <p id="local-status" class="text-2xl font-semibold tracking-tight text-slate-900"></p>
                </div>
            </div>

            <!-- View 3: Outcome Screens -->
            <div id="view-outcome" class="hidden text-center py-4 space-y-6">
                <div id="outcome-image-container" class="hidden mb-4 rounded-2xl overflow-hidden shadow-lg border border-border-subtle">
                    <img id="outcome-image" src="" alt="Outcome" class="w-full h-auto">
                </div>
                <div id="outcome-icon" class="text-6xl mb-4"></div>
                <h2 id="outcome-headline" class="text-3xl font-semibold tracking-tight leading-tight"></h2>
                <p id="outcome-subline" class="text-slate-500 text-lg leading-relaxed px-4 font-light"></p>
                <button id="reset-btn" class="mt-8 px-8 py-4 bg-accent-indigo text-white font-semibold rounded-2xl shadow-md hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Re-engage Matrix
                </button>
            </div>
        </div>

        <!-- Full-width Footer -->
        <div id="toss-footer" class="hidden w-full h-32 overflow-hidden shrink-0">
            <img src="Stalemate.png" alt="AI Footer" class="w-full h-full object-cover">
        </div>
    </div>

    <script>
        const config = {
            "branding": {
                "title": "Are you future ready?",
                "tagline": "Are you safe in the AI-driven world? Let's check if you are future ready to survive the AI, or if you just need to switch your career."
            },
            "tossScreen": {
                "searchingText": "Flipping Coin...",
                "aiFirstText": "AI Wins Toss - Commencing Simulation",
                "humanFirstText": "You Win Toss - Make Your Move"
            },
            "outcomeScreens": {
                "victory": {
                    "headline": "System Dominance Achieved",
                    "subline": "The AI calculated every timeline. Your defeat was mathematically inevitable.",
                    "buttonText": "Re-engage Matrix",
                    "icon": "🤖"
                },
                "draw": {
                    "headline": "Flawless Stalemate",
                    "subline": "Impressive. You executed perfect play to hold off an optimal engine.",
                    "buttonText": "Test Your Focus Again",
                    "icon": "⚔️",
                    "image": "Stalemate.png"
                }
            }
        };

        const STATE = {
            board: Array(9).fill(null),
            isAiTurn: false,
            gameActive: false,
            aiToken: 'O',
            humanToken: 'X'
        };

        const DOM = {
            views: {
                toss: document.getElementById('view-toss'),
                gameplay: document.getElementById('view-gameplay'),
                outcome: document.getElementById('view-outcome')
            },
            grid: document.getElementById('grid'),
            tossStatus: document.getElementById('toss-status'),
            coinInner: document.getElementById('coin-inner'),
            headerContainer: document.getElementById('header-image-container'),
            tossFooter: document.getElementById('toss-footer'),
            startTossBtn: document.getElementById('start-toss-btn'),
            gameStatus: document.getElementById('game-status'),
            localOverlay: document.getElementById('local-overlay'),
            localStatus: document.getElementById('local-status'),
            outcomeHeadline: document.getElementById('outcome-headline'),
            outcomeSubline: document.getElementById('outcome-subline'),
            outcomeIcon: document.getElementById('outcome-icon'),
            outcomeImage: document.getElementById('outcome-image'),
            outcomeImageContainer: document.getElementById('outcome-image-container'),
            resetBtn: document.getElementById('reset-btn')
        };

        // Synthetic Audio Generator
        const SFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            whoosh() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 1);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 1);
            },
            ping() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        function switchView(viewName) {
            Object.keys(DOM.views).forEach(v => DOM.views[v].classList.add('hidden'));
            DOM.views[viewName].classList.remove('hidden');
            
            // Show header image only on Toss and Gameplay views
            if (viewName === 'outcome') {
                DOM.headerContainer.classList.add('hidden');
            } else {
                DOM.headerContainer.classList.remove('hidden');
            }

            // Show footer image only on Toss view
            if (viewName === 'toss') {
                DOM.tossFooter.classList.remove('hidden');
            } else {
                DOM.tossFooter.classList.add('hidden');
            }
        }

        function initGame() {
            STATE.board = Array(9).fill(null);
            STATE.gameActive = false;
            renderBoard();
            switchView('toss');
            
            DOM.tossStatus.innerText = "Click below to start";
            DOM.startTossBtn.classList.remove('hidden');
            DOM.coinInner.style.transform = 'rotateY(0deg)';
            DOM.coinInner.classList.remove('coin-flipping');
        }

        function startToss() {
            SFX.whoosh();
            DOM.startTossBtn.classList.add('hidden');
            DOM.tossStatus.innerText = config.tossScreen.searchingText;
            DOM.coinInner.classList.add('coin-flipping');
            
            setTimeout(() => {
                DOM.coinInner.classList.remove('coin-flipping');
                const aiStarts = Math.random() < 0.5;
                STATE.isAiTurn = aiStarts;
                
                const finalRotation = 1800 + (aiStarts ? 180 : 0);
                DOM.coinInner.style.transform = `rotateY(${finalRotation}deg)`;
                
                setTimeout(() => {
                    SFX.ping();
                    DOM.tossStatus.innerText = aiStarts ? config.tossScreen.aiFirstText : config.tossScreen.humanFirstText;
                    
                    setTimeout(() => {
                        switchView('gameplay');
                        STATE.gameActive = true;
                        if (STATE.isAiTurn) {
                            aiMove();
                        } else {
                            updateStatus("Your Turn");
                        }
                    }, 1000);
                }, 1500);
            }, 1000);
        }

        function updateStatus(text) {
            DOM.gameStatus.innerText = text;
        }

        function renderBoard() {
            DOM.grid.innerHTML = '';
            STATE.board.forEach((cell, idx) => {
                const btn = document.createElement('button');
                btn.className = `h-24 w-full bg-slate-50 border border-slate-100 rounded-2xl text-4xl font-black flex items-center justify-center transition-all duration-300 ${!cell && STATE.gameActive ? 'hover:bg-white hover:shadow-md hover:-translate-y-1 cursor-pointer' : 'cursor-default'}`;
                
                if (cell) {
                    btn.innerText = cell;
                    btn.classList.add(cell === STATE.aiToken ? 'text-accent-indigo' : 'text-accent-emerald');
                    btn.classList.add('scale-110');
                }
                
                btn.addEventListener('click', () => handleHumanMove(idx));
                DOM.grid.appendChild(btn);
            });
        }

        function handleHumanMove(idx) {
            if (STATE.board[idx] || STATE.isAiTurn || !STATE.gameActive) return;
            
            makeMove(idx, STATE.humanToken);
            if (!checkGameOver()) {
                STATE.isAiTurn = true;
                updateStatus("AI Thinking...");
                setTimeout(aiMove, 500);
            }
        }

        function makeMove(idx, token) {
            STATE.board[idx] = token;
            renderBoard();
        }

        function aiMove() {
            if (!STATE.gameActive) return;
            const best = minimax(STATE.board, STATE.aiToken);
            makeMove(best.index, STATE.aiToken);
            
            if (!checkGameOver()) {
                STATE.isAiTurn = false;
                updateStatus("Your Turn");
            }
        }

        function checkGameOver() {
            const result = getGameResult(STATE.board);
            if (result) {
                STATE.gameActive = false;
                showLocalResolution(result);
                return true;
            }
            return false;
        }

        function showLocalResolution(result) {
            DOM.localStatus.innerText = result === 'draw' ? "STALEMATE" : "AI WINS";
            DOM.localOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                DOM.localOverlay.classList.add('hidden');
                showOutcome(result);
            }, 3000);
        }

        function showOutcome(result) {
            switchView('outcome');
            const isDraw = result === 'draw';
            const data = isDraw ? config.outcomeScreens.draw : config.outcomeScreens.victory;
            
            DOM.outcomeHeadline.innerText = data.headline;
            DOM.outcomeSubline.innerText = data.subline;
            DOM.outcomeIcon.innerText = data.icon;
            DOM.resetBtn.innerText = data.buttonText;

            if (data.image) {
                DOM.outcomeImage.src = data.image;
                DOM.outcomeImageContainer.classList.remove('hidden');
                DOM.outcomeIcon.classList.add('hidden');
                
                if (isDraw) {
                    // Hide everything else for Stalemate
                    DOM.outcomeHeadline.classList.add('hidden');
                    DOM.outcomeSubline.classList.add('hidden');
                    DOM.resetBtn.classList.add('hidden');
                    DOM.outcomeImage.style.cursor = 'pointer';
                    DOM.outcomeImage.onclick = initGame;
                } else {
                    DOM.outcomeHeadline.classList.remove('hidden');
                    DOM.outcomeSubline.classList.remove('hidden');
                    DOM.resetBtn.classList.remove('hidden');
                    DOM.outcomeImage.style.cursor = 'default';
                    DOM.outcomeImage.onclick = null;
                }
            } else {
                DOM.outcomeImageContainer.classList.add('hidden');
                DOM.outcomeIcon.classList.remove('hidden');
                DOM.outcomeHeadline.classList.remove('hidden');
                DOM.outcomeSubline.classList.remove('hidden');
                DOM.resetBtn.classList.remove('hidden');
            }
        }

        function getGameResult(board) {
            const wins = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            
            for (let w of wins) {
                if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) {
                    return board[w[0]] === STATE.aiToken ? 'ai' : 'human';
                }
            }
            
            if (board.every(cell => cell !== null)) return 'draw';
            return null;
        }

        function minimax(newBoard, player) {
            const availSpots = newBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);

            const result = getGameResult(newBoard);
            if (result === 'human') return { score: -10 };
            if (result === 'ai') return { score: 10 };
            if (availSpots.length === 0) return { score: 0 };

            const moves = [];
            for (let i = 0; i < availSpots.length; i++) {
                const move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === STATE.aiToken) {
                    const res = minimax(newBoard, STATE.humanToken);
                    move.score = res.score;
                } else {
                    const res = minimax(newBoard, STATE.aiToken);
                    move.score = res.score;
                }

                newBoard[availSpots[i]] = null;
                moves.push(move);
            }

            let bestMove;
            if (player === STATE.aiToken) {
                let bestScore = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }
            return moves[bestMove];
        }

        DOM.resetBtn.addEventListener('click', initGame);
        DOM.startTossBtn.addEventListener('click', startToss);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'));
        }

        initGame();
    </script>
</body>
</html>
